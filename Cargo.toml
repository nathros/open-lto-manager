[package]
name = "openltomanager"
version = "0.1.0"
authors = ["nathros"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.9", optional = true }
balloon-hash = { version = "0.4.0", optional = true }
base64 = { version = "0.22.1", optional = true }
chrono = { version = "0.4.44", features = ["serde"] }
dioxus = { version = "0.7.9", features = ["router", "fullstack"] }
enum-iterator = { version = "2.3.0" } # Replace with std::mem::variant_count when stable
fontdb = { version = "0.23.0", optional = true }
krilla = { version = "0.7.0", optional = true }
krilla-svg = { version = "0.7.0", optional = true }
rand_core = { version = "0.6", features = ["std"], optional = true  }
reqwest = { version = "0.13.3", features = [], optional = true }
rusqlite = { version = "0.39.0", features = ["bundled", "chrono"], optional = true }
serde = { version = "1.0.228", features = [] }
serde_json = { version = "1.0.149", features = [], optional = true } # /dev only
sha2 = { version = "0.10.9", optional = true }
tokio = { version = "1.52.3", features = ["process"], optional = true }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.22", optional = true }
usvg  = { version = "0.45.1", optional = true }
uuid  = { version = "1.23.0", features = ["v4"], optional = true }
uzers = { version = "0.12.2", optional = true }
whoami = { version = "2.1.2", optional = true }

[dev-dependencies]
tempdir = "0.3.7"

[features]
default = ["web", "server"]
web = ["dioxus/web"]
# desktop = ["dioxus/desktop"]
# mobile = ["dioxus/mobile"]
server = ["dioxus/server",
          "dep:axum",
          "dep:balloon-hash",
          "dep:base64",
          "dep:krilla",              # PDF
          "dep:krilla-svg",          # PDF
          "dep:fontdb",              # PDF
          "dep:rand_core",
          "dep:reqwest",
          "dep:rusqlite",
          "dep:serde_json",          # /dev only
          "dep:sha2",
          "dep:tokio",
          "dep:tracing-subscriber",
          "dep:usvg",                # PDF
          "dep:uuid",
          "dep:uzers",
#         "slow_server"              # Testing only
          "dep:whoami"]
slow_server = [] # Testing only, adds delay to all backend requests

[lints.clippy]
unwrap_used = "deny"
allow-unwrap-in-tests = "allow"

# https://dioxuslabs.com/learn/0.5/cookbook/optimizing/#build-configuration
[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# https://book.leptos.dev/deployment/binary_size.html
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
