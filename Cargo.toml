[package]
name = "openltomanager"
version = "0.1.0"
authors = ["nathros"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.43", features = ["serde"] }
dioxus = { version = "0.7.3", features = ["router", "fullstack"] }
rusqlite = { version = "0.38.0", features = ["bundled", "chrono"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", optional = true }
uzers = { version = "0.12.2", optional = true }
whoami = { version = "2.1.1", optional = true }

[features]
default = ["web", "server"]
web = ["dioxus/web"]
# desktop = ["dioxus/desktop"]
# mobile = ["dioxus/mobile"]
server = ["dioxus/server", "dep:rusqlite", "dep:tokio", "dep:tracing-subscriber", "dep:uzers", "dep:whoami"]
# server = ["dioxus/server", "dep:rusqlite", "dep:tokio" "dep:tracing-subscriber", "dep:uzers", "dep:whoami", "slow_server"] # Testing only
slow_server = [] # Testing only, adds delay to all requests

[lints.clippy]
unwrap_used = "deny"
allow-unwrap-in-tests = "allow"

# https://dioxuslabs.com/learn/0.5/cookbook/optimizing/#build-configuration
[profile.release]
opt-level = "z"
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false

# https://book.leptos.dev/deployment/binary_size.html
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
